<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>PokéAline</title>
        <link
            rel="shortcut icon"
            href="./Assets/images/pokeapi_256.png"
            type="image/x-icon"
        />

        <link rel="stylesheet" href="./style.css" />
        <link rel="stylesheet" href="./Styles/cards.css" />

        <script src="./main.js" defer></script>
        <script src="./Scripts/templates.js"></script>

    </head>
    <body onload="init()">
        <header>
            <section class="content-headooter">
                <a href="https://pokeapi.co/" target="_blank" rel="noopener noreferrer">
                    <img src="./Assets/images/pokeapi_256.png" alt="pokeapi logo" />
                </a>
                <h1>Aline's Pokedex</h1>
                <div id="search-bar">
                    <div id="input-and-button">
                        <input 
                        placeholder="Type at least 3 letters"
                        type="text"
                        id="search-bar-input"
                        data-id="search-input"/>
                        
                        <button
                        disabled
                        id="search-button" 
                        data-id=”search-button” 
                        onclick="filterPokemon()">
                        Search</button>
                    </div>
                    <div>
                        <p id="more-letters">More letters...</p>
                    </div>
                </div>
            </section>
        </header>
        <main >
            <section data-id="content" class="content-main">
                <div id="card-wrapper">
                    <!-- --- generated by JS --- -->
                </div>
                <dialog data-id="dialog" class="full-card" id="dialog-popup">
                    <div id="dialog-container" data-id="overlay-pokemon-name" class="dialog-container" data-id="overlay-pokemon-name">
                        <button id="close-button" data-id="close-dialog-button" onclick="closeDialog()">X</button>
                        <div id="pokemon-summary">
                            <!-- --- generated by JS --- -->
                        </div>
                        <div id="pokemon-stats">
                            <!-- --- generated by JS --- -->
                        </div>
                        <div id="pokemon-slider">
                            <!-- --- generated by JS --- -->
                        </div>
                    </div>
                </dialog>
                <div id="loading">
                    <div id="mini-loading-screen">
                        <p>Loading... Please wait.</p>
                    </div>
                    <button onclick="addMorePokemon()" id="load-more-button" data-id="load-more-button">CATCH MORE</button>
                </div>
                <dialog id="error-message">
                    <div id="error-message-container">
                        <p data-id="not-found">No Pokémon found :-(</p>
                        <button id="close-error-message-button" onclick="closeErrorMessage()">Close</button>
                    </div>
                </dialog>
            </section>
            <div id="loading-screen">
                <p>Loading... Please wait.</p>
            </div>
        </main>
        <footer>
            <section class="content-headooter" id="footer-content">
                <p>&#169; Aline 2026</p>
            </section>
        </footer>
    </body>
</html>
