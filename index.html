<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>PokéAline</title>
        <link
            rel="shortcut icon"
            href="./Assets/images/pokeapi_256.png"
            type="image/x-icon"
        />

        <link rel="stylesheet" href="./style.css" />
        <link rel="stylesheet" href="./Styles/cards.css" />
        <link rel="stylesheet" href="./Styles/fonts.css" />
        <link rel="stylesheet" href="./Styles/dialog.css" />

        <script src="./main.js" defer></script>
        <script src="./Scripts/templates.js"></script>
        <script src="./test.js"></script>
    </head>
    <body onload="init()">
        <header>
            <section class="content-headooter">
                <img src="./Assets/images/pokeapi_256.png" alt="pokeapi logo" />
                <h1>Aline's Pokedex</h1>
                <div id="search-bar">
                    <input 
                    placeholder="Type at least 3 letters"
                    type="text"
                    id="search-bar-input"
                    data-id="search-input"/>

                    <button
                    disabled
                    id="search-button" 
                    data-id=”search-button” 
                    onclick="filterPokemon()">
                    Search</button>
                </div>
            </section>
        </header>
        <main>
            <section data-id="content" class="content-main">
                <div id="card-wrapper">
                    <!-- --- generated by JS --- -->
                </div>
                <dialog data-id="dialog" class="full-card" id="dialog-popup">
                    <div data-id="overlay-pokemon-name" class="dialog-container" data-id="overlay-pokemon-name">
                        <button id="close-button" data-id="close-dialog-button" onclick="closeDialog()">X</button>
                        <div id="pokemon-summary">
                            <!-- --- generated by JS --- -->
                        </div>
                        <div id="pokemon-stats">
                            <!-- --- generated by JS --- -->
                        </div>
                        <div id="pokemon-slider">
                            <!-- --- generated by JS --- -->
                        </div>
                    </div>
                </dialog>
                <div id="loading">
                    <button onclick="addMorePokemon()" id="load-more-button" data-id="load-more-button">CATCH MORE</button>
                </div>
            </section>
        </main>
        <footer>
            <section class="content-headooter" id="footer-content">
                <p>&#169; Aline 2026</p>
            </section>
        </footer>
    </body>
</html>
